<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - CSI Film Fiesta</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background:#000; color:#fff; }
        .navbar { position:sticky; top:0; display:flex; justify-content:space-between; align-items:center; padding:12px 5%; background:#0b0b0b; border-bottom:1px solid #222; z-index:10; }
        .logo { height:36px; cursor:pointer; }
        .btn { background:#e50914; color:#fff; border:none; padding:10px 14px; border-radius:10px; cursor:pointer; font-weight:700; }
        .container { padding: 20px 5%; }
        .grid { display:grid; grid-template-columns: 1fr; gap:16px; }
        .card { background:#0f0f0f; border:1px solid #222; border-radius:12px; padding:16px; }
        .card h3 { margin-bottom:10px; color:#e50914; }
        .table { width:100%; border-collapse: collapse; }
        .table th, .table td { padding:10px; border-bottom:1px solid #222; text-align:left; font-size:0.95rem; color:#ddd; }
        .badge { display:inline-block; padding:4px 8px; border-radius:999px; background:#1f2937; font-size:0.8rem; }
        .muted { color:#aaa; font-size:0.9rem; }
        @media (min-width: 900px) { .grid { grid-template-columns: 1.2fr 2fr; } }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>
<body>
    <nav class="navbar">
        <img src="assets/film_fiesta_logo.png" class="logo" id="home-logo" alt="Logo">
        <button class="btn" id="signout">Sign out</button>
    </nav>
    <div class="container">
        <div class="grid">
            <div class="card">
                <h3>Overview</h3>
                <div class="muted" id="overview">Loading...</div>
            </div>
            <div class="card">
                <h3>All Bookings</h3>
                <table class="table" id="bookings-table">
                    <thead>
                        <tr>
                            <th>User ID</th>
                            <th>Full Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Movie</th>
                            <th>Seat</th>
                            <th>Created</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://ccjtxsyfgrdbseiiovur.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNjanR4c3lmZ3JkYnNlaWlvdnVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU3MTY1NDQsImV4cCI6MjA3MTI5MjU0NH0.y9cDGV_6nGeBpPps_GXKC_Dt0790v56RkaZ89oT3oiQ';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        document.getElementById('home-logo').onclick = () => { window.location.href = 'index.html'; };
        document.getElementById('signout').onclick = async () => { await supabase.auth.signOut(); window.location.href = 'index.html'; };

        function fmt(d) { try { return new Date(d).toLocaleString(); } catch { return d; } }

        async function ensureAdmin() {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) { window.location.href = 'index.html'; return null; }
            // Client-side check: allow only admin email
            if (user.email && user.email.toLowerCase() === 'admin@gmail.com') return user;
            window.location.href = 'index.html';
            return null;
        }

        async function loadData() {
            const user = await ensureAdmin();
            if (!user) return;
            const { data, error } = await supabase
                .from('booking')
                .select('user_id, full_name, email, phone, movie, seat_no, created_at')
                .order('created_at', { ascending: false });
            if (error) {
                alert('Failed to load bookings: ' + (error.message || 'Unknown'));
                return;
            }
            const tbody = document.querySelector('#bookings-table tbody');
            tbody.innerHTML = '';
            const total = data ? data.length : 0;
            const withSeats = (data || []).filter(r => !!r.seat_no);
            const booked = withSeats.length;
            const uniqueUsers = new Set((data || []).map(r => r.user_id)).size;
            document.getElementById('overview').textContent = `Total rows: ${total} | Users: ${uniqueUsers} | Booked seats: ${booked}`;
            (data || []).forEach(r => {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td class="muted">${r.user_id || ''}</td>
                                <td>${r.full_name || ''}</td>
                                <td>${r.email || ''}</td>
                                <td>${r.phone || ''}</td>
                                <td><span class="badge">${r.movie || ''}</span></td>
                                <td>${r.seat_no || '-'}</td>
                                <td class="muted">${fmt(r.created_at)}</td>`;
                tbody.appendChild(tr);
            });
        }

        loadData();
    </script>
</body>
</html>
